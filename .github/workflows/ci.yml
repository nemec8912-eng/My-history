name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee tsc.log || {
            grep -E 'error TS' tsc.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error title=build::$(tail -n 60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Check static export (with base path)
        env:
          NEXT_PUBLIC_BASE_PATH: /My-history
        run: |
          set -o pipefail
          rm -rf out .next
          npm run build 2>&1 | tee build2.log || {
            echo "::error title=build-basepath::$(tail -n 60 build2.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          echo "::notice title=out::$(cd out && find . -maxdepth 2 | sort | head -40 | tr '\n' ' ')"
          grep -o 'href="[^"]*manifest[^"]*"' out/index.html | head -1 | sed 's/^/::notice title=manifest-link::/'
          grep -o '"start_url":"[^"]*"' out/manifest.webmanifest | sed 's/^/::notice title=start_url::/' || true
