name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee tsc.log || {
            grep -E 'error TS' tsc.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error title=build::$(tail -n 60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
