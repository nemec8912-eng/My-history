name: Deploy to GitHub Pages

# Каждый push в main публикует сайт: https://<user>.github.io/My-history/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Report files
        run: |
          touch out/.nojekyll
          echo "::notice title=pages::$(cd out && find . -name '*.html' -o -name 'manifest*' -o -name 'sw.js' | sort | tr '\n' ' ')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps webkit chromium
      - name: Check live site
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          OUT_DIR: live
        run: |
          sleep 20
          node e2e/cloud.mjs || true
          node e2e/screens.mjs
      - name: Publish screenshots to ci-screens branch
        run: |
          cd live
          git init -q -b ci-screens
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          echo "live ${{ github.sha }}" > SHA
          git add -A
          git commit -qm "Live screens for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-screens
